services:
  web:
    build: .
    env_file:
      - path: backend/.env
        required: false
    environment:
      # In production leave DATABASE_URL OUT of .env and inject it here.
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "8000:8000"
    # The image default also starts the scheduler; in compose we keep the
    # scheduler in its own service so restarts are independent.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 2 --threads 4 --timeout 90"
    restart: unless-stopped

  # Minute-granular scheduler: checks + notifications + daily sweeps.
  scheduler:
    build: .
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    restart: unless-stopped
    command: python manage.py run_scheduler

  # Optional local Postgres for testing the production path.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: statusmonitor
      POSTGRES_PASSWORD: statusmonitor
      POSTGRES_DB: statusmonitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statusmonitor"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

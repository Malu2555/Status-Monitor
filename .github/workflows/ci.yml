name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # pyright is installed via pip; use the runner's Node instead of letting
      # the wrapper download one at run time.
      PYRIGHT_PYTHON_GLOBAL_NODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Type-check (pyright, zero errors)
        run: |
          pyright --version
          pyright

      - name: Audit dependencies (informational)
        continue-on-error: true
        run: pip-audit

      - name: Tests
        run: python manage.py test --verbosity 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    # Render builds the deployment image from the pushed commit; this job proves
    # the Dockerfile and the container start command work before a deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build --tag status-monitor:ci .

      - name: Smoke-test the container (health endpoint)
        run: |
          docker run --detach --name status-monitor-ci \
            --publish 8000:8000 \
            --env DEBUG=False \
            --env SECRET_KEY=ci-only-secret \
            --env JWT_SIGNING_KEY=ci-only-signing \
            status-monitor:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
              echo
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs status-monitor-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs status-monitor-ci || true

      - name: Clean up
        if: always()
        run: docker rm --force status-monitor-ci || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ---------------------------------------------------------------------------
# OPTIONAL EXTERNAL DRIVER — manual-only.
#
# The production container runs `manage.py run_scheduler` itself. This workflow
# is a backstop you trigger by hand; there is intentionally NO `schedule:` so it
# cannot burn Actions minutes (or wake a sleeping service) until you add one.
#
# Repository secrets (steps are skipped while these are empty):
#   API_BASE_URL      e.g. https://your-api.onrender.com (no trailing slash)
#   SCHEDULER_TOKEN   same value as the API's SCHEDULER_TOKEN env var
# ---------------------------------------------------------------------------
name: cron (optional backstop)

on:
  workflow_dispatch:

concurrency:
  group: cron-manual
  cancel-in-progress: false

jobs:
  minute-jobs:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
    steps:
      - name: run_checks
        if: env.API_BASE_URL != ''
        run: |
          curl --fail --silent --show-error --max-time 50 \
            -X POST "$API_BASE_URL/api/admin/scheduler/run-checks" \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN"

      - name: deliver_notifications
        if: env.API_BASE_URL != ''
        run: |
          curl --fail --silent --show-error --max-time 50 \
            -X POST "$API_BASE_URL/api/admin/scheduler/deliver-notifications" \
            -H "X-Scheduler-Token: $SCHEDULER_TOKEN"

      - name: not configured (no-op)
        if: env.API_BASE_URL == ''
        run: echo "API_BASE_URL secret not set — external cron is disabled."

  daily-jobs:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_TOKEN }}
    steps:
      - name: daily jobs
        if: env.API_BASE_URL != ''
        run: |
          for job in check-ssl check-domains crawl-links; do
            curl --fail --silent --show-error --max-time 50 \
              -X POST "$API_BASE_URL/api/admin/scheduler/$job" \
              -H "X-Scheduler-Token: $SCHEDULER_TOKEN"
          done

      - name: not configured (no-op)
        if: env.API_BASE_URL == ''
        run: echo "API_BASE_URL secret not set — no external daily jobs."
